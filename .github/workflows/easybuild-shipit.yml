# Run this workflow when the "test" workflow completes successfully on the main branch.
#
# Please adapt the "test" workflow name and the branch filter to your needs.
on:
  workflow_run:
    workflows: ["test"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: EasyBuild ShipIt

# Learn more at https://github.com/easybuild-org/EasyBuild.ShipIt#github-actions-auto-release

jobs:
  # Generate a Pull Request to prepare a release
  shipit-pr:
    name: ShipIt - Pull Request
    runs-on: ubuntu-latest
    # 'completed' fires whatever the conclusion is, so a failed test run has to be filtered out.
    if: "github.event.workflow_run.conclusion == 'success'"
    steps:
      - uses: actions/checkout@v7
        with:
          # We need to fetch more than the last commit to be able to generate the changelog based on the commit history.
          # Adapt this value based on your needs.
          fetch-depth: 300
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: ShipIt (Pull Request)
        run: |
          dotnet tool restore
          dotnet shipit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release your packages when the PR is merged (or if you create a 'chore: release ...' commit directly on main).
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only trigger this workflow when a commit starting with `chore: release ` is pushed.
    if: "github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_commit.message, 'chore: release ')"
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6

      # Trusted publishing: NuGet hands out a short-lived key in exchange for this run's OIDC
      # token, so the repository holds no API key. Register this repository as a trusted
      # publisher on nuget.org for the account below.
      #
      # Learn more at https://github.com/NuGet/login
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: MangelMaxime

      # Packs Glutinum.Types, Glutinum.Web and Glutinum.Node, pushes them and publishes the CLI to npm
      - name: Release
        run: ./build.sh release
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Read the version published
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The hub regenerates its bindings with the release, in a pull request.
      # HUB_DISPATCH_TOKEN is a fine-grained token with "Contents: write" on glutinum-org/hub.
      - name: Notify the hub
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.HUB_DISPATCH_TOKEN }}
          repository: glutinum-org/hub
          event-type: glutinum-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'
