# Build and test your project on every pull request, and on every push to the main branch.
#
# The "easybuild-shipit.yml" workflow waits for this one to succeed before preparing a release,
# so if you rename this workflow, remember to update the "workflows" filter over there as well.
name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-node

      - name: Cache the Playwright browsers
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install

      # The Glutinum.Web tests drive a real browser
      - name: Install the Playwright browsers
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browsers come back from the cache, the system libraries they need do not
      - name: Install the Playwright system libraries
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test
        run: ./build.sh test

  bindings:
    name: Bindings are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-node
      # A generator change must come with the bindings it produces
      - run: ./build.sh bindings --check

  lint:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - run: ./build.sh lint
